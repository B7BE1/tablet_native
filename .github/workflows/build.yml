name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build App
      run: |
        xcodebuild -project OsuTablet.xcodeproj -scheme OsuTablet -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO clean build -derivedDataPath build

    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/OsuTablet.app Payload/
        zip -r OsuTablet.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OsuTablet-IPA
        path: OsuTablet.ipa
